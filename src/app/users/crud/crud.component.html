<section>
  <h1 class="h4 mb-3">Users</h1>

  <p *ngIf="isLoading" class="text-muted">Loading users...</p>
  <div *ngIf="errorMessage" class="alert alert-warning" role="alert">{{ errorMessage }}</div>

  <div class="row g-3" *ngIf="!isLoading && !errorMessage">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let user of userList">
      <app-user-card [user]="user"></app-user-card>
    </div>
    <p *ngIf="userList.length === 0" class="text-muted">No users found.</p>
  </div>
</section>
